name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgis/postgis:16-3.4
        env:
          POSTGRES_DB: geopolitics
          POSTGRES_USER: postgres
          POSTGRES_HOST_AUTH_METHOD: trust  # throwaway CI database, no password needed
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      PYTHONPATH: ${{ github.workspace }}
      DATABASE_URL: postgresql+asyncpg://postgres@localhost:5432/geopolitics
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version-file: backend/.python-version
          cache: pip
          cache-dependency-path: backend/requirements*.txt
      - run: pip install -r backend/requirements.txt -r backend/requirements-dev.txt
      - name: Tests
        run: python -m pytest backend/tests -q
      # Same migrations docker-compose runs, from an empty PostGIS database.
      - name: Migrations build the schema from empty
        run: alembic -c backend/alembic.ini upgrade head

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - name: Typecheck
        run: npx tsc --noEmit
      - name: Tests
        run: npm test
      # ponytail: non-blocking until the 2 existing react-hooks/set-state-in-effect errors are fixed; then drop continue-on-error
      - name: Lint
        run: npm run lint
        continue-on-error: true
